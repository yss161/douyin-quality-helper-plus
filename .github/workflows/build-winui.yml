name: build-winui

# 在 GitHub 的 Windows runner 上编译 WinUI 3 版本并发布 Release。
# 触发：推送 tag（v*）自动发版；或在 Actions 页面手动运行。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # 必须锁 windows-2022：windows-latest 已切到 windows-2025-vs2026，
    # 该镜像上 WindowsAppSDK 的 XamlCompiler.exe（.NET Framework 4.7.2 程序）
    # 会静默退出（exit code 1，无任何输出），导致无法编译 WinUI 3。
    runs-on: windows-2022

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 准备内嵌资源
        shell: pwsh
        run: |
          # payload.js = 内置脚本 + 装载器 + 画质强制器（与 exe-src/build.ps1 同顺序）
          $root = $PWD
          $embed  = Join-Path $root 'injector/userscript.bundle.embedded.js'
          $loader = Join-Path $root 'injector/userscript-loader.js'
          $qual   = Join-Path $root 'injector/payload.js'
          $dst    = Join-Path $root 'winui/Resources/payload.js'

          if (-not (Test-Path $embed))  { throw '缺少 injector/userscript.bundle.embedded.js，先跑 node tools/build-userscript.js' }
          if (-not (Test-Path $loader)) { throw '缺少 injector/userscript-loader.js' }

          $nl = [char]10
          $pieces = @()
          $pieces += (Get-Content -Raw -Encoding UTF8 $embed).TrimEnd()
          $pieces += (Get-Content -Raw -Encoding UTF8 $loader).TrimEnd()
          $pieces += (Get-Content -Raw -Encoding UTF8 $qual)
          $text = ($pieces -join $nl) + $nl

          [System.IO.File]::WriteAllText($dst, $text, (New-Object System.Text.UTF8Encoding($false)))
          Write-Host ('payload.js: ' + (Get-Item $dst).Length + ' bytes')

          Copy-Item (Join-Path $root 'versions.json') (Join-Path $root 'winui/Resources/versions.json') -Force
          Copy-Item (Join-Path $root 'injector/userscript.bundle.js') (Join-Path $root 'winui/Resources/userscript.bundle.js') -Force
          Write-Host ('userscript.bundle.js: ' + (Get-Item (Join-Path $root 'winui/Resources/userscript.bundle.js')).Length + ' bytes')

      - name: 编译（x64，自包含）
        shell: pwsh
        run: |
          # 先单独跑一次 restore，再看详细日志定位 XamlCompiler 的真实错误
          dotnet build winui/DouyinQualityHelper.WinUI.csproj -c Release -r win-x64 -p:Platform=x64 -p:WindowsAppSDKSelfContained=true -v:n 2>&1 | Tee-Object -FilePath build.log
          $code = $LASTEXITCODE
          Write-Host "---- build exit: $code ----"
          if ($code -ne 0) {
            Write-Host "==== 相关错误行 ===="
            Select-String -Path build.log -Pattern 'error|XamlCompiler|Xaml.*error' -SimpleMatch:$false |
              Select-Object -First 40 | ForEach-Object { $_.Line }

            # XamlCompiler 把真实原因写到 output.json / 或者根本不写（崩溃）。
            # 这里把 obj 下所有相关文件都倒出来，并手动再跑一次拿 stderr。
            Write-Host "==== obj 目录 ===="
            Get-ChildItem -Path winui/obj -Recurse -Filter '*.json' -ErrorAction SilentlyContinue |
              Select-Object -First 10 | ForEach-Object { $_.FullName }

            $inJson = Get-ChildItem -Path winui/obj -Recurse -Filter 'input.json' -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($inJson) {
              Write-Host "==== 手动执行 XamlCompiler ===="
              $xc = Get-ChildItem -Path "$env:USERPROFILE/\.nuget/packages/microsoft.windowsappsdk" -Recurse -Filter 'XamlCompiler.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($xc) {
                $outFile = Join-Path $inJson.DirectoryName 'manual-output.json'
                Write-Host ("exe: " + $xc.FullName)
                & $xc.FullName $inJson.FullName $outFile 2>&1 | ForEach-Object { Write-Host ("  XC> " + $_) }
                Write-Host ("exit: " + $LASTEXITCODE)
                if (Test-Path $outFile) {
                  Write-Host "==== manual-output.json ===="
                  Get-Content $outFile -Raw
                }
              } else {
                Write-Host '找不到 XamlCompiler.exe'
              }
            }
            throw "build 失败，退出码 $code"
          }
          dotnet publish winui/DouyinQualityHelper.WinUI.csproj -c Release -r win-x64 -p:Platform=x64 --self-contained true -p:WindowsAppSDKSelfContained=true -o publish/x64

      - name: 整理产物
        shell: pwsh
        run: |
          $out = 'artifact'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item 'publish/x64/*' $out -Recurse -Force

          if (Test-Path 'versions.json') { Copy-Item 'versions.json' $out -Force }
          if (Test-Path 'dist/使用说明.txt') { Copy-Item 'dist/使用说明.txt' $out -Force }

          $exe = Join-Path $out 'DouyinQualityHelper.exe'
          if (-not (Test-Path $exe)) { throw '编译产物里找不到 DouyinQualityHelper.exe' }
          Write-Host ('EXE: ' + (Get-Item $exe).Length + ' bytes')

      - name: 自检（确保内嵌资源完好）
        shell: pwsh
        run: |
          $exe = 'artifact/DouyinQualityHelper.exe'
          & $exe --selftest
          $code = $LASTEXITCODE
          if (Test-Path 'artifact/selftest.txt') { Get-Content 'artifact/selftest.txt' }
          if ($code -ne 0) { throw ('selftest 失败，退出码 ' + $code) }

      - name: 打包 zip
        shell: pwsh
        run: |
          $ver = '${{ github.ref_name }}'
          if ([string]::IsNullOrEmpty($ver)) { $ver = 'dev' }
          $name = 'douyin-quality-helper-winui-' + $ver + '-x64.zip'
          Compress-Archive -Path 'artifact/*' -DestinationPath ('dist/' + $name) -Force
          Write-Host ('created dist/' + $name)

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: winui-x64
          path: dist/*.zip
          retention-days: 14

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
          name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
