name: mini-winui-test
on:
  push:
    paths:
      - 'mini-probe/**'
  workflow_dispatch:
jobs:
  mini:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: build minimal WinUI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path mini | Out-Null
          @'
<Project Sdk="Microsoft.NET.Sdk">
  <PropertyGroup>
    <OutputType>WinExe</OutputType>
    <TargetFramework>net8.0-windows10.0.19041.0</TargetFramework>
    <TargetPlatformMinVersion>10.0.17763.0</TargetPlatformMinVersion>
    <UseWinUI>true</UseWinUI>
    <WindowsPackageType>None</WindowsPackageType>
    <EnableMsixTooling>false</EnableMsixTooling>
    <RootNamespace>Mini</RootNamespace>
    <Nullable>disable</Nullable>
  </PropertyGroup>
  <ItemGroup>
    <PackageReference Include="Microsoft.WindowsAppSDK" Version="1.6.250205002" />
    <PackageReference Include="Microsoft.Windows.SDK.BuildTools" Version="10.0.26100.1742" />
  </ItemGroup>
</Project>
'@ | Set-Content -Path mini/Mini.csproj -Encoding UTF8
          @'
<?xml version="1.0" encoding="utf-8"?>
<Application
    x:Class="Mini.App"
    xmlns="http://schemas.microsoft.com/winfx/2006/xaml/presentation"
    xmlns:x="http://schemas.microsoft.com/winfx/2006/xaml" />
'@ | Set-Content -Path mini/App.xaml -Encoding UTF8
          @'
using Microsoft.UI.Xaml;
namespace Mini {
    public partial class App : Application {
        public App() { InitializeComponent(); }
        protected override void OnLaunched(LaunchActivatedEventArgs args) { }
    }
}
'@ | Set-Content -Path mini/App.xaml.cs -Encoding UTF8
          @'
namespace Mini {
    public static class Program {
        [System.STAThread]
        static void Main(string[] args) { }
    }
}
'@ | Set-Content -Path mini/Program.cs -Encoding UTF8
          dotnet build mini/Mini.csproj -c Release -r win-x64 -p:Platform=x64 -v:n 2>&1 | Tee-Object -FilePath mini.log
          Write-Host ('exit: ' + $LASTEXITCODE)
          Select-String -Path mini.log -Pattern 'error' | Select-Object -First 10 | ForEach-Object { $_.Line }